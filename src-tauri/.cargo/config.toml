# Force DuckDB's bundled C++ to compile with the VS2022 (MSVC 14.44) toolset.
#
# Why: `libduckdb-sys` builds DuckDB's vendored `fmt`, whose `format.h` uses
# `stdext::checked_array_iterator` behind `#ifdef _SECURE_SCL`. MSVC 14.51
# (VS2026 / VS18 Insiders) removed that STL extension but its headers still
# define `_SECURE_SCL`, so the dead branch is compiled and the build fails with
# `error C2653: 'stdext' is not a class or namespace name`. No command-line
# define fixes it (the STL header re-defines `_SECURE_SCL` after ours), and the
# vendored `fmt` is identical across duckdb 1.2-1.4. The only working toolchain
# is MSVC 14.44 (VS2022), whose STL still ships `stdext::checked_array_iterator`.
#
# cc-rs (used by libduckdb-sys) auto-detects the *newest* MSVC unless `CXX`/`CC`
# are pinned. We pin them to the 14.44 `cl.exe` and supply that toolset's
# `INCLUDE` so DuckDB's C++ is *compiled* with 14.44 headers (which still ship
# `stdext::checked_array_iterator`).
#
# We deliberately do NOT set `LIB`: Rust's own MSVC linker (`link.exe`, the
# 14.51 one rustc detects) also reads `LIB`, and feeding it 14.44 lib dirs mixes
# toolsets and fails linking with `LNK1103`. cc-rs only *compiles* DuckDB's
# objects (no linking), so it needs `INCLUDE` but not `LIB`; the final link uses
# the linker's native 14.51 libs. Compiling with 14.44 and linking with 14.51 is
# ABI-compatible across these adjacent MSVC versions.
#
# MACHINE-SPECIFIC: these absolute paths match this dev box (VS2022 Build Tools).
# On another machine, regenerate `INCLUDE` from a VS2022 `vcvars64.bat`, or build
# from inside a VS2022 developer shell (which makes this file unnecessary).
# Windows-only, local-dev build shim; it does not affect macOS/Linux.
[env]
CC = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\bin\HostX64\x64\cl.exe'
CXX = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\bin\HostX64\x64\cl.exe'
INCLUDE = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\include;C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\ATLMFC\include;C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\VS\include;C:\Program Files (x86)\Windows Kits\10\include\10.0.26100.0\ucrt;C:\Program Files (x86)\Windows Kits\10\include\10.0.26100.0\um;C:\Program Files (x86)\Windows Kits\10\include\10.0.26100.0\shared;C:\Program Files (x86)\Windows Kits\10\include\10.0.26100.0\winrt;C:\Program Files (x86)\Windows Kits\10\include\10.0.26100.0\cppwinrt;C:\Program Files (x86)\Windows Kits\NETFXSDK\4.8\include\um'
