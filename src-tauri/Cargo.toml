[package]
name = "terax"
version = "0.13.1"
description = "Terax — an open-source AI-native terminal emulator"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"
# Two bins (terax, terax-dbg) make `cargo run` ambiguous; pin the prod bin so
# `pnpm tauri dev` / `cargo run` keep working without `--bin`.
default-run = "terax"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Prod binary. Tauri targets this by default (`tauri.conf.json` mainBinaryName).
[[bin]]
name = "terax"
path = "src/main.rs"

# Debug binary — same entry point, separate exe so `cargo run --bin terax-dbg`
# builds and runs without colliding with a running `terax.exe` lock, and can be
# killed independently by name.
[[bin]]
name = "terax-dbg"
path = "src/bin/terax-dbg.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "5"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
shared_child = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Parquet preview via the Arrow reader. `async` + `object_store` enable the
# `ParquetObjectReader`/`ParquetRecordBatchStreamBuilder` path so S3 objects can
# be range-paged without a full download (see `modules/s3.rs`); the listed
# features cover the Arrow bridge plus the common on-disk compression codecs.
parquet = { version = "53", default-features = false, features = [
	"arrow",
	"async",
	"object_store",
	"snap",
	"flate2",
	"zstd",
] }
# S3 object access for the S3 browser. `object_store` gives a uniform ranged
# reader the async parquet stream consumes; `aws-sdk-s3`/`aws-config` cover
# listing, byte fetches, and the full AWS auth chain (static keys, profiles,
# SSO, IAM) plus custom endpoints (MinIO/R2/Wasabi).
object_store = { version = "0.11", features = ["aws"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
# `DisplayErrorContext` walks the full Smithy error `source()` chain into one
# string so S3 failures surface the real cause (e.g. `PermanentRedirect` region
# mismatch) instead of the flat top-level "service error".
aws-smithy-types = "1"
# Arrow with default features so `arrow::util::display::array_value_to_string`
# (used to stringify cells) is always available.
arrow = "53"
# DuckDB (bundled = compiles libduckdb from source, no system lib) powers the
# SQL query editor for CSV/Parquet files via the core `read_csv_auto` /
# `read_parquet` table functions — no network-loaded extension needed. SQLite
# query files go through `rusqlite` instead (genuine SQLite SQL, already bundled),
# so we never depend on DuckDB's network-installed `sqlite_scanner`. Accessed via
# the row API only (not its Arrow bridge) to avoid pulling a second `arrow` major.
duckdb = { version = "1", features = ["bundled"] }
# Excel (.xlsx) export of query results. Pure-Rust writer, no native dep.
rust_xlsxwriter = "0.79"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# Native Save dialog for exporting query results to a user-chosen path.
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = [
	"rt",
	"rt-multi-thread",
	"net",
	"io-util",
	"time",
	"macros",
	"process",
] }
tempfile = "3"
notify = "8.2.0"
russh = "0.45"
russh-sftp = "2"
russh-keys = "0.45"
async-trait = "0.1"
# OTEL collector. opentelemetry-proto ships pre-generated prost message types
# (gen-tonic-messages, NOT gen-tonic — no gRPC/tonic/protoc), and `with-serde`
# adds the OTLP/JSON-correct codecs: trace/span ids as hex strings and int64
# fields as decimal strings. The same `Export*ServiceRequest` struct decodes
# from both protobuf (prost) and JSON (serde) wire formats. trace/logs/metrics
# gate the per-signal module paths. prost is the decoder for the binary wire.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
	"gen-tonic-messages",
	"with-serde",
	"trace",
	"logs",
	"metrics",
] }
prost = "0.14"
# Embedded loopback HTTP/1.1 server for OTLP/HTTP ingest. hyper + http-body-util
# are already in the tree via reqwest; we only switch on hyper's `server`
# feature. flate2 (miniz_oxide backend, no C) is already present via parquet and
# decompresses gzip-encoded OTLP request bodies.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
flate2 = "1"

[dev-dependencies]
proptest = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_Media",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

# Release tuned for CI wall-clock, not minimum binary size. codegen-units=16
# lets LLVM parallelize across the runner's cores; lto="thin" keeps most of
# fat-LTO's runtime win while parallelizing + caching the link step (the slow
# tail after "Compiling" finishes). opt-level="s" still favors a small binary.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
