name: Release

on:
  push:
    tags:
      - "v*"
    # Build (but do not release) on main so swatinem/rust-cache populates a cache
    # on the DEFAULT branch. GitHub Actions cache scope is per-ref: sibling v*
    # tags can't read each other's cache, but every ref (including each tag) CAN
    # read the default-branch cache. Without this, each release recompiles the
    # whole dep tree cold (~27m). The release step is gated on the tag ref below.
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--features sql` compiles DuckDB into the release (CSV/Parquet SQL
          # editor). DuckDB is OFF by default so `tauri dev` skips its bundled
          # C++ amalgamation (issue #72); release builds opt back in here.
          #
          # The explicit `--target x86_64-pc-windows-msvc` (the host triple, so NOT
          # a cross-compile) is what makes this row fast: the sidecar scripts build
          # the 4 Rust sidecar crates into `target\<triple>\release\`, and without a
          # matching `--target` here tauri-action would build terax into the bare
          # `target\release\` — a DIFFERENT dir — so the whole shared dep tree
          # (arrow/aws/russh/duckdb) compiled TWICE (~22m sidecars + ~33m tauri).
          # Sharing one target dir collapses that to a single dep compile. The
          # macOS rows already do this via their cross-compile targets.
          - platform: windows-latest
            args: "--features sql --target x86_64-pc-windows-msvc"
            rust-target: "x86_64-pc-windows-msvc"
          # macOS Apple Silicon. macos-14 runners are arm64, so this is a native
          # build (no cross-compile). The explicit target makes the sidecar
          # output path deterministic and matches what the sidecar scripts stage.
          - platform: macos-14
            args: "--features sql --target aarch64-apple-darwin"
            rust-target: "aarch64-apple-darwin"
          # macOS Intel. macos-14 runners are arm64; building x86_64 here is a
          # cross-compile (the Apple toolchain ships both slices, so no extra SDK
          # is needed — only the rustup target, added below).
          - platform: macos-14
            args: "--features sql --target x86_64-apple-darwin"
            rust-target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    env:
      # Fallback triple for any sidecar build that runs without an explicit
      # `--target=` (resolution order in the sidecar scripts: --target= flag >
      # this env > host triple). The explicit "Build bunqueue sidecars" step below
      # passes --target= directly so this is normally redundant there, but it keeps
      # the right triple if any sidecar step is invoked arg-less. The `pretauri`
      # lifecycle hook was REMOVED (it double-built sidecars inside tauri-action and
      # misfired the triple on cross-compile rows); sidecars are now staged ONCE by
      # the explicit step before tauri-action's arg-less `pnpm tauri build` runs.
      TERAX_SIDECAR_TARGET: ${{ matrix.rust-target }}
    steps:
      - uses: actions/checkout@v4

      # Windows Defender real-time protection scans every file write. A cargo
      # build emits millions of small .rlib/.rmeta/incremental files (plus the
      # MSVC linker's temp objects), each triggering a scan — the dominant reason
      # windows-latest Rust builds run far slower than macOS. Exclude the build
      # output dirs + the toolchain processes up front. Admin is required;
      # hosted runners have it, so guard on Windows and continue-on-error so a
      # self-hosted/non-admin runner degrades to "slow but works" instead of
      # failing the release.
      - name: Exclude build dirs from Windows Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Pin the Bun version so setup-bun's tool cache actually hits across runs;
      # `latest` re-resolves and re-downloads every time, defeating the cache and
      # making sidecar output nondeterministic between releases.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # Empty rust-target collapses to a trailing dash; drop it so the key is
          # just the platform. swatinem still appends Cargo.lock + toolchain hashes.
          key: ${{ matrix.platform }}${{ matrix.rust-target != '' && format('-{0}', matrix.rust-target) || '' }}
          # tauri-action links the final crate late (lto=fat). If that step fails,
          # still persist the cached dep compile so the retry skips rebuilding the
          # whole AWS/arrow/parquet/russh tree.
          cache-on-failure: true
          # Cache the build script + proc-macro outputs too, not just deps.
          cache-all-crates: true

      # pnpm-workspace.yaml pins supportedArchitectures to win32/x64 for local
      # Windows dev. On the macOS runners, add the host (darwin/arm64) set via the
      # --os/--cpu install flags so the darwin-native optionals (rollup, esbuild,
      # sharp) that vite/tauri need get installed alongside the pinned set. The
      # Windows row keeps the bare install (its pin already matches the runner).
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile ${{ runner.os == 'macOS' && '--os current --cpu current' || '' }}

      # bunqueue is Bun-only and absent from packaged builds; compile it (and its
      # workers) into standalone sidecars so tauri-action can bundle them via
      # bundle.externalBin. Must run before tauri-action. Defaults to the host
      # triple; pass the matrix target for cross-compile rows.
      - name: Build bunqueue sidecars
        run: pnpm build:sidecars ${{ matrix.rust-target != '' && format('--target={0}', matrix.rust-target) || '' }}
        env:
          # fetch-sidecar-binaries.mjs hits the GitHub releases API (rg, s5cmd).
          # Unauthenticated calls share a 60 req/hr/IP budget that hosted runners
          # exhaust → 403. Pass the per-job token to lift the cap to 5000 req/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main-branch runs stop here: the cache is already populated above by the
      # cargo compile that tauri-action would do, so on main we run a plain
      # release build purely to warm the cache (no release artifacts/publish).
      # `--features sql` compiles DuckDB into release builds (the CSV/Parquet SQL
      # editor). It is OFF by default so `tauri dev` skips DuckDB's bundled C++
      # amalgamation (issue #72); release/CI opts back in here.
      # Pass the SAME args as the release step (incl. the per-row --target) so the
      # cache this warms matches what tauri-action compiles on the tag run — the
      # Intel row cross-compiles x86_64, so warming the host arm64 cache would
      # miss. --no-bundle skips artifact creation; we only want the dep compile.
      - name: Warm cache (main only, no release)
        if: github.ref == 'refs/heads/main'
        run: pnpm tauri build --no-bundle ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Tag runs create + publish the release. Reuses the warm cache from main.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Fork repos get a read-only GITHUB_TOKEN that cannot create releases
          # ("Resource not accessible by integration"). Use a PAT with repo scope
          # so tauri-action can create + publish the release on this fork.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Terax ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install. Auto-update is built in."
          # Publish the release automatically once all matrix artifacts upload, so
          # a v* tag push goes live (and reaches the auto-updater) with no manual
          # "Publish" click in the GitHub UI.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
