name: Release

on:
  push:
    tags:
      - "v*"
    # Build (but do not release) on main so swatinem/rust-cache populates a cache
    # on the DEFAULT branch. GitHub Actions cache scope is per-ref: sibling v*
    # tags can't read each other's cache, but every ref (including each tag) CAN
    # read the default-branch cache. Without this, each release recompiles the
    # whole dep tree cold (~27m). The release step is gated on the tag ref below.
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Pin the Bun version so setup-bun's tool cache actually hits across runs;
      # `latest` re-resolves and re-downloads every time, defeating the cache and
      # making sidecar output nondeterministic between releases.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # Empty rust-target collapses to a trailing dash; drop it so the key is
          # just the platform. swatinem still appends Cargo.lock + toolchain hashes.
          key: ${{ matrix.platform }}${{ matrix.rust-target != '' && format('-{0}', matrix.rust-target) || '' }}
          # tauri-action links the final crate late (lto=fat). If that step fails,
          # still persist the cached dep compile so the retry skips rebuilding the
          # whole AWS/arrow/parquet/russh tree.
          cache-on-failure: true
          # Cache the build script + proc-macro outputs too, not just deps.
          cache-all-crates: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # bunqueue is Bun-only and absent from packaged builds; compile it (and its
      # workers) into standalone sidecars so tauri-action can bundle them via
      # bundle.externalBin. Must run before tauri-action. Defaults to the host
      # triple; pass the matrix target for cross-compile rows.
      - name: Build bunqueue sidecars
        run: pnpm build:sidecars ${{ matrix.rust-target != '' && format('--target={0}', matrix.rust-target) || '' }}

      # main-branch runs stop here: the cache is already populated above by the
      # cargo compile that tauri-action would do, so on main we run a plain
      # release build purely to warm the cache (no release artifacts/publish).
      - name: Warm cache (main only, no release)
        if: github.ref == 'refs/heads/main'
        run: pnpm tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Tag runs create + publish the release. Reuses the warm cache from main.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Fork repos get a read-only GITHUB_TOKEN that cannot create releases
          # ("Resource not accessible by integration"). Use a PAT with repo scope
          # so tauri-action can create + publish the release on this fork.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Terax ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install. Auto-update is built in."
          # Publish the release automatically once all matrix artifacts upload, so
          # a v* tag push goes live (and reaches the auto-updater) with no manual
          # "Publish" click in the GitHub UI.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
